[agent]
preset = "claude"

[check]
command = "cargo test --workspace -q 2>&1 && cargo clippy --all-targets -q -- -D warnings 2>&1 && cargo fmt --all --check"
force = "cargo test --workspace -q 2>&1 && cargo clippy --all-targets -q -- -D warnings 2>&1 && cargo fmt --all --check"
fail_name = '^test (\S+) \.\.\. FAILED$'

[layout]
contract_file = "crates/harness/src/lib.rs"
source_root = "crates/harness"
source_ext = [".rs", ".toml", ".md"]
test_file_suffix_re = '\.rs'
test_decl_patterns = ["fn {name}("]
harness_files = ["Cargo.toml", "crates/harness/Cargo.toml"]
harness_globs = []
allowed_prefixes = ["crates/", "roles/", "templates/", "skills/", "evals/", "adapters/", "docs/", ".github/", ".harness/", ".claude/", "target/"]
docs = [".check-baseline", "AGENTS.md", "CLAUDE.md", "GEMINI.md", "QWEN.md", "README.md", "LICENSE", "NOTICE", "DECISIONS.md", "LEARNINGS.md", "PROGRESS.md", "PROGRESS.archive.md", "SPEC.md", "TASKS.md", "harness.toml", "harness.lock", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "driver.sh", ".editorconfig", ".shellcheckrc", ".gitignore"]
harness_allow = ["Cargo.toml", "Cargo.lock", ".gitignore"]
machinery = [".DS_Store", "STOP", "target", "node_modules", "__pycache__"]
