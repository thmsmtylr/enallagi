name = "go"
detect_files = ["go.mod"]
detect_re = ""
test_command = "go test ./..."
run_re = 'go test\b'
fail_name = '^\s*--- FAIL: (\S+) \([0-9.]+m?s\)$'
test_file_suffix_re = '_test\.go$'
test_decl_patterns = ["func {name}("]
source_ext = [".go"]
source_roots = ["cmd", "internal", "pkg"]
test_only_glob = ["**/*_test.go"]
skip_patterns = ['\bt\.Skip(Now)?\(\)']
hosts = ["proxy.golang.org", "sum.golang.org"]
write = ["~/go/pkg/mod", "~/.cache/go-build", "~/Library/Caches/go-build"]
