name = "pytest"
detect_files = ["pyproject.toml", "pytest.ini", "setup.cfg", "tox.ini", "requirements.txt"]
detect_re = 'pytest\b'
test_command = "pytest"
run_re = 'pytest\b'
fail_name = '^FAILED \S+::(\S+)'
test_file_suffix_re = '(^|/)test_[^/]+\.py$|_test\.py$'
test_decl_patterns = ["def {name}("]
source_ext = [".py"]
source_roots = ["src"]
test_only_glob = ["**/test_*.py", "**/*_test.py"]
# no lookahead in the regex crate, so the parenthesised arguments are spelled out to exclude `reason=`
skip_patterns = ['^\s*@pytest\.mark\.(skip|xfail)(\(([^r]|r[^e]|re[^a]|rea[^s]|reas[^o]|reaso[^n]|reason[^=])*\))?\s*$']
hosts = ["pypi.org", "files.pythonhosted.org"]
caches = ["PIP_CACHE_DIR", "UV_CACHE_DIR"]
