# Embedded defaults; enallagi.toml deep-merges over them, tables key by key and arrays whole.

# preset names the agent's headless command (claude, codex, ... or custom with a command list); [agent.<role>] overrides it per role.
[agent]
preset = "claude"
rate_limit_pattern = "hit your session limit"

# command decides whether the tree is green, force is the same check uncached, fail_name's group 1 is the failing test's name; all empty until init detects a runner.
[check]
command = ""
force = ""
fail_name = ""
# tally is a regex over each output line; its named groups passed and failed are summed. Empty reads cargo's `test result:` lines.
tally = ""
# timeout bounds both forms; a check that runs past it is killed with its process group and halts the run.
timeout = "30m"
# claims_allow is the command prefixes the claims gate re-runs from a verdict's ran: lines, twice each; empty re-runs nothing. A command carrying ; & | ` $ < > or a newline never runs.
claims_allow = []

# drain is the standing proposed blocks one adjudicate stage takes; turns_per_block sizes that stage; proposed_rounds is how long a proposed block may stand; title_cap_from is the first id the 72-character title cap applies to.
[queue]
drain = 3
turns_per_block = 25
proposed_rounds = 6
title_cap_from = 1

# per_task has enallagi run push each landed task to its own branch and open its pull request, as --pr-per-task does.
[pr]
per_task = false
# "auto" merges a ticket's pull request on green; it needs a holdout set, a USD or token budget and the sandbox.
merge = "human"

# writers is how many writer lanes `enallagi worktree` runs at once, each on a ticket whose scope overlaps no other's.
[parallel]
writers = 1

[layout]
# context_file is the file every role reads first, unset meaning AGENTS.md beside the queue; pointer_files are one-line pointers to it for tools that cannot take it on their command line.
pointer_files = ["CLAUDE.md", "GEMINI.md", "QWEN.md", ".github/copilot-instructions.md"]

# harness_dir holds the roles, hooks and scratch state; skills_dir is the agent's skills directory, unset meaning the preset's own.
harness_dir = ".enallagi"
skill_invocation = "invoke it via the Skill tool"

# driver_command runs the built artifact in a throwaway directory and prints one `FINDING ` line per shortfall; empty is off, and ENALLAGI_DRIVER=1 is also required.
driver_command = ""

# spec is relative to harness_dir; empty is the first specs/<slug>/spec.md holding rows_heading, else the one init seeds. Exit-criteria rows are read from it and from every other specs/<slug>/spec.md.
spec = ""
rows_heading = "### Exit criteria"
rows_end_heading = "## Out of Scope"
source_root = ""
contract_file = "src/schema.ts"
test_file_suffix_re = ""
test_decl_patterns = []
test_glob = []
# test_only_glob names the files red-first keeps when it reverts the rest of a task to its base; empty skips the gate.
test_only_glob = []
# skip_patterns are regexes over the lines a task adds to test_glob files; a match is a skip with no stated reason, and skip-added forces the task back.
skip_patterns = []
source_ext = [".ts", ".tsx", ".js", ".mjs", ".cjs", ".sh", ".py"]

harness_files = [
  "package.json",
  "turbo.json",
  "check.ts",
  "Makefile",
  "pyproject.toml",
]
harness_globs = ["packages/*/package.json"]
allowed_prefixes = [
  "src/",
  "packages/",
  "evals/",
  ".enallagi/",
  ".claude/",
  ".github/",
  ".codex/",
  ".gemini/",
  ".cursor/",
  ".qwen/",
  ".omp/",
]
docs = [
  ".check-baseline",
  "AGENTS.md",
  "README.md",
  "LICENSE",
  "LICENCE",
  "NOTICE",
  "BLOCKED.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "DECISIONS.md",
  "GEMINI.md",
  "LEARNINGS.md",
  "PROGRESS.archive.md",
  "PROGRESS.md",
  "QWEN.md",
  "REFERENCES.md",
  "SECURITY.md",
  "SPEC.md",
  "TASKS.md",
  "harness.default.toml",
  "harness.lock",
  "enallagi.toml",
  "test-hashes.json",
]
harness_allow = [
  "package.json",
  "turbo.json",
  "tsconfig.json",
  "check.ts",
  "hooks.json",
  "package-lock.json",
  ".gitignore",
  "Makefile",
  "pyproject.toml",
]
machinery = [
  ".DS_Store",
  ".check",
  ".turbo",
  ".venv",
  "STOP",
  "__pycache__",
  "build",
  "dist",
  "node_modules",
  "out",
  "target",
]

# learnings_cap is the most entries LEARNINGS.md may hold; at the cap, adding one means removing one.
learnings_cap = 12

# review runs before task: a task left at review is verified before a new one is taken.
[[pipeline]]
name = "review"
when = "queue.reviewing"
stages = ["verify"]

# decompose runs before task: an accepted spec with no tickets is broken down, numbered and triaged first.
[[pipeline]]
name = "decompose"
when = "spec.undecomposed"
stages = ["decompose", "adjudicate"]

# adjudicate runs last: the round drains whatever the verdict filed before the next task is picked.
[[pipeline]]
name = "task"
when = "queue.takeable"
stages = ["implement", "verify", "adjudicate"]

# triage runs before discover: a queued block is adjudicated before the scout files more, one dry round then discover.
[[pipeline]]
name = "triage"
when = "queue.proposed"
stages = ["adjudicate"]
end_after_dry_rounds = 1

[[pipeline]]
name = "discover"
when = "!queue.takeable"
stages = ["scout", "adjudicate"]
end_after_dry_rounds = 2

[[stage]]
name = "implement"
role = "implementer"
turns = 120
post = ["queue-intact", "commit-identity", "commit-task", "implementer-not-done"]

[[stage]]
name = "verify"
role = "verifier"
turns = 100
post = ["commit-verdict", "queue-intact", "commit-identity", "verdict", "claims", "skip-added", "security", "red-first", "scope", "install-stale", "holdout"]

[[stage]]
name = "scout"
role = "scout"
turns = 30
env = { ENALLAGI_DRIVER = "1" }

[[stage]]
name = "decompose"
role = "decomposer"
turns = 60
post = ["tickets", "commit-round", "queue-intact"]

[[stage]]
name = "adjudicate"
role = "adjudicator"
turns = 40
post = ["commit-round", "queue-intact", "adjudicator-halt", "dry-round"]

# gate names the probe, rail or hook that fails without the skill, or the literal `none`; an id is the last segment of its upstream path, so a bare name inside a skill body resolves, and an id renamed here is renamed in roles/ too.

[[skill]]
id = "to-tickets"
source = "github:mattpocock/skills"
path = "skills/engineering/to-tickets"
rev = "v1.3.2"
gate = "tickets"
why = "a spec is broken into thin vertical slices with blocking edges before any writer takes one"

[[skill]]
id = "triage"
source = "github:mattpocock/skills"
path = "skills/engineering/triage"
rev = "v1.3.2"
gate = "anchored"
why = "every new ticket is judged and moved to a triage state before a writer sees it"

[[skill]]
id = "tdd"
source = "github:mattpocock/skills"
path = "skills/engineering/tdd"
rev = "v1.3.2"
gate = "spec-untested"
why = "the failing test that encodes the acceptance criteria is written before the code"

[[skill]]
id = "diagnosing-bugs"
source = "github:mattpocock/skills"
path = "skills/engineering/diagnosing-bugs"
rev = "v1.3.2"
gate = "anchored"
why = "a failure is reproduced by a command before any theory about it is acted on"

[[skill]]
id = "codebase-design"
source = "github:mattpocock/skills"
path = "skills/engineering/codebase-design"
rev = "v1.3.2"
gate = "contracts"
why = "an interface is shaped as a deep module before code is written against it"

[[skill]]
id = "writing-for-agents"
source = "github:mattpocock/skills"
path = "skills/productivity/writing-for-agents"
rev = "v1.3.2"
gate = "context-behind"
why = "a doc, skill or role an agent reads is written in one register"

[[skill]]
id = "domain-modeling"
source = "github:mattpocock/skills"
path = "skills/engineering/domain-modeling"
rev = "v1.3.2"
gate = "citable"
why = "the glossary and ADRs keep one word for one thing"

[[skill]]
id = "code-review"
source = "github:mattpocock/skills"
path = "skills/engineering/code-review"
rev = "v1.3.2"
gate = "verdict"
why = "a diff is reviewed against its spec and its standards as two separate axes"

[[skill]]
id = "ponytail"
source = "github:DietrichGebert/ponytail"
path = "skills/ponytail"
rev = "v5.3.3"
gate = "ponytail-ceiling"
why = "the ladder is walked before any new code, and a shortcut taken anyway is marked"

[[skill]]
id = "ponytail-review"
source = "github:DietrichGebert/ponytail"
path = "skills/ponytail-review"
rev = "v5.3.3"
gate = "minimal"
why = "a diff is read for what to delete before it is accepted"

[[skill]]
id = "caveman-commit"
source = "github:JuliusBrussee/caveman"
path = "skills/caveman-commit"
rev = "v2.7.0"
gate = "plain-record"
why = "a commit subject names what changed and stops there"

[[skill]]
id = "receiving-code-review"
source = "github:obra/superpowers"
path = "skills/receiving-code-review"
rev = "v6.3.0"
gate = "rejection-repeat"
why = "a rejected task answers every rejection point before it is re-implemented"

[[skill]]
id = "verification-before-completion"
source = "github:obra/superpowers"
path = "skills/verification-before-completion"
rev = "v6.3.0"
gate = "blocked-is-allowed"
why = "no completion claim without the exact command and its pasted output"

# [[role]] takes name, source, path and rev as [[skill]] does; <path>/<name>.md vendors to <harness_dir>/roles/<name>.md and pins in harness.lock.
