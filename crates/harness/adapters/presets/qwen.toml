name = "qwen"
argv = ["qwen", "-p", "{prompt}", "--output-format", "stream-json", "--max-session-turns", "{turns}"]
bypass_flag = "--yolo"
turn_cap = "flag"
model_flag = "--model"
instruction_file = "QWEN.md"
hooks_file = ".qwen/settings.json"

[usage]
input_tokens = "usage.input_tokens"
output_tokens = "usage.output_tokens"

[hook_events]
pre_tool_use = "PreToolUse"
stop = "Stop"
prompt_submit = "UserPromptSubmit"
