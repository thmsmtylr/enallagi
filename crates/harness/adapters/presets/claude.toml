name = "claude"
argv = ["claude", "-p", "{prompt}", "--output-format", "stream-json", "--verbose", "--max-turns", "{turns}", "--append-system-prompt-file", "{context_file}", "--plugin-dir", "{harness_dir}/adapters/claude", "--settings", '{"attribution":{"commit":"","pr":""},"enabledPlugins":{plugins_off:~/.claude/settings.json},"permissions":{"deny":["Monitor","Bash(git push:*)","Bash(git reset --hard:*)","Bash(git clean:*)","Bash(rm -rf:*)","Read(./.env)","Read(./.env.local)","Read(./**/.env)","Read(./**/.env.local)"]}}', "--dangerously-skip-permissions"]
turn_cap = "flag"
model_flag = "--model"
effort_flag = "--effort"
skills_dir = "{harness_dir}/adapters/claude/skills"
invocation = "invoke it via the Skill tool as `harness:<id>`"
instruction_file = "CLAUDE.md"
hooks_file = "{harness_dir}/adapters/claude/hooks/hooks.json"

[usage]
cost = "total_cost_usd"
input_tokens = "usage.input_tokens"
output_tokens = "usage.output_tokens"
cache_creation_input_tokens = "usage.cache_creation_input_tokens"
cache_read_input_tokens = "usage.cache_read_input_tokens"
turns = "num_turns"

[hook_events]
pre_tool_use = "PreToolUse"
stop = "Stop"
prompt_submit = "UserPromptSubmit"
