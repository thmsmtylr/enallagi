# `shell` lints the scripts that remain (driver.sh, docs/*.sh, adapters/bun-turbo/*.sh, evals/*.sh)
# with bash -n, shellcheck at full severity, and `docs/bootstrap.sh --check` against the whole log.
# `driver` runs the ignored test that drives the release binary through a real install. `package`
# refuses a dogfood instance on main or in a pull request into it. `skills`
# fetches every pinned skill from harness.lock and checks it against its pin. `rust` runs
# fmt, clippy at -D warnings and the workspace test suite on both userlands. `cross-build` proves the
# four release targets compile. Every `uses:` is pinned to a 40-character commit SHA with its tag in
# a trailing comment (`every_github_action_is_pinned_to_a_commit_sha`, crates/harness/tests/floor.rs).
# ENALLAGI_EVALS is deliberately never set: the evals spawn a real agent, and a CI job holding a model
# credential is the blast radius this project argues against.
name: ci

on:
  push:
  pull_request:
  branch_protection_rule:
  schedule:
    - cron: '19 4 * * 2'

permissions:
  contents: read

jobs:
  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # fetch-depth: 0 because docs/bootstrap.sh reads the dogfood rounds out of the whole log;
      # at the default depth of 1 it has no history to derive the record from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: shellcheck is on the runner
        run: command -v shellcheck || sudo apt-get install -y shellcheck
      - name: every script parses on this bash
        run: git ls-files '*.sh' | xargs -n1 bash -n
      - name: shellcheck at full severity
        run: git ls-files '*.sh' | xargs shellcheck
      - name: the bootstrap record holds against this history
        run: ./docs/bootstrap.sh --check

  # `the_package_driver_reports_shortfalls_as_finding_lines` is `#[ignore]`d because it installs a
  # throwaway repo and drives the release binary through it; `--include-ignored driver` selects that
  # one test by name and none of the other ignored tests (the retired shellcheck/shfmt stand-ins, the
  # eval that needs ENALLAGI_EVALS). ENALLAGI_DRIVER=1 is set HERE and nowhere else in this file --
  # without it the test still runs but skips the assertion that reaches the artifact.
  driver:
    name: driver
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: the driver reaches the built artifact
        env:
          ENALLAGI_DRIVER: '1'
        run: cargo test -p enallagi --test floor -- --include-ignored driver

  # main is the published package. A dogfood instance, or a round with no strip commit, fails here on
  # a push to main and on a pull request into it; dogfood/* branches carry the instance and skip.
  package:
    name: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # fetch-depth: 0 because the check reads the dogfood rounds out of the whole log
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: the published package tracks no instance file
        run: cargo test -p enallagi --test floor -- --include-ignored --exact main_tracks_no_instance_file

  # The vendored skills are not in the tree: `sync` fetches them from harness.lock and `check`
  # refuses a pin whose vendored content no longer hashes to what the lock records, so a tag moved
  # or deleted upstream fails here rather than at a stage.
  skills:
    name: skills
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: every declared skill resolves from the lock
        run: cargo run -q -p enallagi -- skills sync
      - name: and matches the pin the lock records
        run: cargo run -q -p enallagi -- skills check

  # fmt, clippy at -D warnings, and the workspace test suite, on both userlands: macos-latest and
  # ubuntu-latest differ in their default toolchains and filesystem behaviour, and this is the only
  # job here that runs the crate's tests.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # fetch-depth: 0 because tests/floor.rs runs docs/bootstrap.sh --check against this checkout,
      # and at the default depth of 1 there is no history to derive a dogfood round from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace

  # Proves the four binaries the release job ships actually compile, cross-compiled from a single
  # ubuntu-latest runner with zig as the linker (cargo-zigbuild) rather than four separate runners.
  # No release is cut here; the outputs are CI artifacts only, retained for inspection.
  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.13.0'
      - name: cargo-zigbuild is the cross-build linker
        run: cargo install cargo-zigbuild --locked
      - name: x86_64-unknown-linux-musl
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl
      - name: aarch64-unknown-linux-musl
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl
      - name: x86_64-apple-darwin
        run: cargo zigbuild --release --target x86_64-apple-darwin
      - name: aarch64-apple-darwin
        run: cargo zigbuild --release --target aarch64-apple-darwin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enallagi-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/enallagi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enallagi-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/release/enallagi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enallagi-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release/enallagi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enallagi-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/enallagi

  # Scorecard refuses on anything but the default branch, and publishing needs an OIDC token a
  # pull_request run does not get, so this job is skipped there rather than failed.
  scorecard:
    name: openssf scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'branch_protection_rule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
